name: Daily Digest

on:
  schedule:
    # ~04:00 UK (BST, UTC+1): primary 03:17 UTC, retry 04:47 UTC (~05:45 UK).
    # In GMT (winter) that's 03:17 / 04:47 UK. Use :17/:47 to avoid on-the-hour
    # GitHub queue spikes. Schedule is best-effort; the retry is a failsafe only
    # if today's digest is not already on main (see precheck step below).
    - cron: "17 3 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if today's digest already published
        id: precheck
        run: |
          digest="site/src/content/digests/$(date -u +%F).md"
          if [ -f "$digest" ]; then
            echo "Digest for $(date -u +%F) already on main; retry not needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No digest for $(date -u +%F); running pipeline."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.precheck.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        if: steps.precheck.outputs.skip != 'true'
        working-directory: pipeline
        run: uv sync --frozen

      - name: Run pipeline
        if: steps.precheck.outputs.skip != 'true'
        working-directory: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: uv run python -m digest.main

      - name: Commit and push digest
        if: steps.precheck.outputs.skip != 'true'
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/src/content/digests data/seen.json
          if git diff --cached --quiet; then
            echo "Nothing to commit (already published today)."
          else
            git commit -m "digest: $(date -u +%F)"
            # main may have moved while the pipeline ran; rebase our commit on top.
            git pull --rebase origin main
            git push
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failure: ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              "The daily digest pipeline failed.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              labels: "pipeline-failure",
              state: "open",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ["pipeline-failure"],
              });
            }
